name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: python -m unittest discover -v
        env:
          TELEGRAM_BOT_TOKEN: 123456:TEST-TOKEN-TEST-TOKEN-TEST-TOKEN-TE
          GEMINI_API_KEY: test-gemini
          NOTION_API_KEY: test-notion
          NOTION_FOOD_DB_ID: 00000000000000000000000000000001
          NOTION_DAILY_DB_ID: 00000000000000000000000000000002
          ALLOWED_USER_IDS: "1"
