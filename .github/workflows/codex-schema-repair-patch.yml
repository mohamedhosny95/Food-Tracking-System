name: Codex Schema Repair Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply schema repair and verify
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/codex.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/codex.patch.gz.b64 | gzip -d > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          rm -f .github/workflows/codex-schema-repair-patch.yml
          python3 -m py_compile bot.py config.py notion_helper.py setup_notion.py vision.py tests/test_notion_schema.py
          python3 -m unittest discover
          git add -A
          git commit -m "Repair Notion database schema on startup"
          git push origin HEAD:main
