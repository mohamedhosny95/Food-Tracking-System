name: Codex Publish Notion Hardening

on:
  push:
    paths:
      - .github/workflows/codex-publish-notion-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Apply Codex patch
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/codex-publish-notion-hardening.yml > /tmp/previous-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous-workflow.yml').read_text()
          marker = 'payload = """'
          start = text.index(marker) + len(marker)
          end = text.index('"""', start)
          payload = text[start:end]
          Path('/tmp/codex.patch.b64').write_text(''.join(payload.split()))
          PY
          base64 -d /tmp/codex.patch.b64 | gzip -dc > /tmp/codex.patch
          actual_patch_sha="$(sha256sum /tmp/codex.patch | awk '{print $1}')"
          test "$actual_patch_sha" = "b64c0d362e27729f7832d194396ddab4f5e366562c50016fb8cae80b5aae5c9b"
          git apply --binary /tmp/codex.patch
          rm .github/workflows/codex-publish-notion-hardening.yml
      - name: Test
        run: |
          python3 -m unittest discover
          python3 -m py_compile bot.py config.py notion_helper.py setup_notion.py migrate_notion.py set_commands.py vision.py tests/test_bot_integrity.py tests/test_notion_schema.py tests/test_vision_parsing.py
          git diff --check
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Harden Notion logging writes"
          git push origin HEAD:main
