name: Codex Publish AI Parsing And Saved Meals

on:
  push:
    paths:
      - .github/workflows/codex-publish-ai-saved-meals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Codex patch
        run: |
          set -euo pipefail
          cat > /tmp/codex.patch.b64 <<'PATCH_B64'
          
PATCH_B64
          normalized_b64="$(tr -d '[:space:]' < /tmp/codex.patch.b64)"
          actual_b64_sha="$(printf '%s' "$normalized_b64" | sha256sum | awk '{print $1}')"
          test "$actual_b64_sha" = "b37b34b4da4b33637256ca4fbccf9be44429e140a4c8b645fa82dc891a566312"
          printf '%s' "$normalized_b64" | base64 -d | gzip -dc > /tmp/codex.patch
          actual_patch_sha="$(sha256sum /tmp/codex.patch | awk '{print $1}')"
          test "$actual_patch_sha" = "b4f9f956edb404b2893457ae79367ff4b8ba8413272c6073aca3001c8da71970"
          git apply --binary /tmp/codex.patch
          rm .github/workflows/codex-publish-ai-saved-meals.yml
      - name: Test
        run: |
          python3 -m unittest discover
          python3 -m py_compile bot.py config.py notion_helper.py setup_notion.py migrate_notion.py set_commands.py vision.py tests/test_bot_integrity.py tests/test_notion_schema.py tests/test_vision_parsing.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Harden AI parsing and saved meal schema"
          git push origin HEAD:main
