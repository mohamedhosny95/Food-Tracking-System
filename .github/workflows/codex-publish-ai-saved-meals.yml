      - name: Test
        run: |
          python3 -m unittest discover
          python3 -m py_compile bot.py config.py notion_helper.py setup_notion.py migrate_notion.py set_commands.py vision.py tests/test_bot_integrity.py tests/test_notion_schema.py tests/test_vision_parsing.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Harden AI parsing and saved meal schema"
          git push origin HEAD:main
